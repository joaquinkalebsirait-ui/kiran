<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HER</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #d4a843;
  --gold-light: #f0c97a;
}

html { scroll-behavior: smooth; }

body {
  background: #0a0005;
  color: #f5e6c8;
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
  overflow-y: auto;
}

/* CURTAIN OVERLAY */
#curtain-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  cursor: pointer;
  user-select: none;
}

.curtain-half {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
  overflow: hidden;
}

.curtain-half.left { left: 0; }
.curtain-half.right { right: 0; }

#curtain-overlay.open .curtain-half.left  { transform: translateX(-100%); }
#curtain-overlay.open .curtain-half.right { transform: translateX(100%); }

.curtain-fabric {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #3d0808 0%, #7a1414 20%, #9b2020 40%, #6b1010 60%, #8a1818 80%, #5a0c0c 100%);
  position: relative;
}

.curtain-half.left  .curtain-fabric { border-right: 4px solid var(--gold); box-shadow: inset -40px 0 80px rgba(0,0,0,0.6); }
.curtain-half.right .curtain-fabric { border-left:  4px solid var(--gold); box-shadow: inset  40px 0 80px rgba(0,0,0,0.6); transform: scaleX(-1); }

.curtain-fabric::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0px, rgba(0,0,0,0.18) 10px, transparent 20px, rgba(255,255,255,0.03) 30px, transparent 40px);
}

/* Valance */
.curtain-valance {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 70px;
  background: linear-gradient(180deg, #2a0505, #6b1010);
  border-bottom: 3px solid var(--gold);
  z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 6px;
  gap: 6px;
}

.fringe {
  width: 3px;
  height: 28px;
  background: linear-gradient(180deg, var(--gold), transparent);
  border-radius: 0 0 50% 50%;
  animation: fringeSwing 2s ease-in-out infinite;
}

@keyframes fringeSwing {
  0%,100% { transform: rotate(-6deg); }
  50%      { transform: rotate(6deg); }
}

/* Click prompt */
#click-prompt {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 11;
  animation: promptPulse 2.5s ease-in-out infinite;
}

#click-prompt h1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(3.5rem, 9vw, 8rem);
  color: var(--gold-light);
  text-shadow: 0 0 40px rgba(212,168,67,0.9), 0 0 80px rgba(212,168,67,0.4);
  letter-spacing: 0.2em;
}

#click-prompt p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: rgba(240,201,122,0.75);
  margin-top: 1rem;
}

@keyframes promptPulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.55; }
}

/* STAGE SECTION */
#stage-section {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, #1a0a00, #0a0005 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Spotlights */
.spotlight {
  position: absolute;
  top: 0;
  width: 220px;
  height: 80%;
  clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
  opacity: 0;
  transition: opacity 2s ease;
  pointer-events: none;
  z-index: 2;
}

.spotlight.active { opacity: 1; }

.sp1 { left: calc(50% - 110px); background: radial-gradient(ellipse at 50% 0%, rgba(255,220,100,0.22), rgba(255,200,80,0.06) 60%, transparent); animation: sway1 6s ease-in-out infinite; }
.sp2 { left: calc(22% - 110px); background: radial-gradient(ellipse at 50% 0%, rgba(200,150,255,0.12), transparent 70%); animation: sway2 8s ease-in-out infinite; }
.sp3 { left: calc(78% - 110px); background: radial-gradient(ellipse at 50% 0%, rgba(100,180,255,0.10), transparent 70%); animation: sway3 7s ease-in-out infinite; }

@keyframes sway1 { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
@keyframes sway2 { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(2deg)} }
@keyframes sway3 { 0%,100%{transform:rotate(4deg)}  50%{transform:rotate(-4deg)} }

/* Stage side curtains */
.stage-side {
  position: absolute;
  top: 0;
  width: 70px;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}

.stage-side.left  { left: 0;  background: linear-gradient(90deg,  #3d0808cc, transparent); }
.stage-side.right { right: 0; background: linear-gradient(270deg, #3d0808cc, transparent); }

/* Stage floor */
.stage-floor {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 36%;
  background: linear-gradient(180deg, transparent, rgba(30,15,5,0.7) 30%, #150a02 70%, #0d0601 100%);
  z-index: 1;
  pointer-events: none;
}

.stage-floor::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, rgba(212,168,67,0.5) 50%, var(--gold) 70%, transparent);
  box-shadow: 0 0 18px rgba(212,168,67,0.5);
}

.stage-floor::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent, rgba(0,0,0,0.07) 1px, transparent 80px);
}

/* Performer */
.performer-container {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 36px;
  flex: 1;
  justify-content: center;
}

.performer-wrap {
  position: relative;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.performer-wrap.visible { opacity: 1; }

.performer-glow {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,220,100,0.28) 0%, transparent 70%);
  animation: glowPulse 3s ease-in-out infinite;
  z-index: -1;
}

@keyframes glowPulse {
  0%,100%{ opacity:0.6; transform:scale(1);   }
  50%    { opacity:1;   transform:scale(1.12); }
}

.performer-img {
  width: clamp(200px, 26vw, 370px);
  height: clamp(260px, 34vw, 460px);
  object-fit: cover;
  object-position: center top;
  border-radius: 8px 8px 0 0;
  display: block;
  box-shadow: 0 0 60px rgba(255,180,50,0.4), 0 0 120px rgba(255,150,30,0.18), 0 30px 60px rgba(0,0,0,0.85);
  filter: brightness(1.05) contrast(1.05) saturate(1.1);
  animation: performerSway 4s ease-in-out infinite;
  border: 2px solid rgba(212,168,67,0.4);
}

@keyframes performerSway {
  0%,100%{ transform: translateX(-7px) rotate(-1.2deg); }
  50%    { transform: translateX(7px)  rotate(1.2deg);  }
}

.mic-stand {
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 70px;
  background: linear-gradient(180deg, #888, #444);
}

.mic-head {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 20px;
  background: radial-gradient(ellipse, #aaa, #555);
  border-radius: 50% 50% 40% 40%;
  box-shadow: 0 0 8px rgba(255,220,100,0.5);
}

/* Lyrics */
.lyrics-ticker {
  position: absolute;
  bottom: 38%;
  left: 0; right: 0;
  z-index: 6;
  text-align: center;
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: none;
}

.lyrics-ticker.visible { opacity: 1; }

.lyric-line {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(0.8rem, 1.8vw, 1.15rem);
  color: var(--gold-light);
  text-shadow: 0 0 20px rgba(212,168,67,0.8), 0 2px 4px rgba(0,0,0,0.9);
  letter-spacing: 0.07em;
  padding: 6px 18px;
  background: rgba(0,0,0,0.35);
  display: inline-block;
  border-radius: 4px;
  transition: opacity 0.5s ease;
}

/* Audience */
.audience-section {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 36%;
  z-index: 3;
  overflow: hidden;
}

.audience-row {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 5px;
  position: absolute;
  left: 0; right: 0;
  padding: 0 10px;
}

.audience-row.row1 { bottom: 18%; }
.audience-row.row2 { bottom: 9%;  }
.audience-row.row3 { bottom: 0%;  }

.audience-person {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0px;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.audience-person.visible { opacity: 1; }

.person-head {
  border-radius: 50%;
}

.person-body {
  border-radius: 2px 2px 0 0;
}

.row1 .person-head { width: 12px; height: 12px; }
.row1 .person-body { width: 16px; height: 18px; }
.row2 .person-head { width: 15px; height: 15px; }
.row2 .person-body { width: 20px; height: 22px; }
.row3 .person-head { width: 18px; height: 18px; }
.row3 .person-body { width: 24px; height: 26px; }

.arms { display: flex; gap: 2px; }
.arm-l, .arm-r { width: 3px; height: 9px; border-radius: 2px; }
.arm-l { transform-origin: bottom center; transform: rotate(-45deg); }
.arm-r { transform-origin: bottom center; transform: rotate(45deg); }

.cheer-a { animation: cheerA 1.1s ease-in-out infinite; }
.cheer-b { animation: cheerB 1.4s ease-in-out infinite; }
.cheer-c { animation: cheerC 0.9s ease-in-out infinite; }
.cheer-d { animation: cheerD 1.7s ease-in-out infinite; }

@keyframes cheerA { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-14px) rotate(5deg)} }
@keyframes cheerB { 0%,100%{transform:translateY(0) rotate(3deg)}  50%{transform:translateY(-9px) rotate(-3deg)} }
@keyframes cheerC { 0%,100%{transform:translateY(0)}               50%{transform:translateY(-16px)} }
@keyframes cheerD { 0%,100%{transform:translateY(0) rotate(-2deg)} 33%{transform:translateY(-7px) rotate(4deg)} 66%{transform:translateY(-12px) rotate(-4deg)} }

/* Scroll hint */
.scroll-hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: rgba(212,168,67,0.6);
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
}

.scroll-hint.visible { opacity: 1; animation: scrollBounce 2s ease-in-out infinite; }

@keyframes scrollBounce {
  0%,100%{ transform: translateX(-50%) translateY(0);  opacity: 0.6; }
  50%    { transform: translateX(-50%) translateY(8px); opacity: 1;   }
}

/* Cheer burst */
.cheer-burst {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  color: var(--gold-light);
  text-shadow: 0 0 30px var(--gold);
  z-index: 9998;
  pointer-events: none;
  opacity: 0;
}

.cheer-burst.show {
  animation: burstAnim 2.2s ease-out forwards;
}

@keyframes burstAnim {
  0%  { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  20% { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
  70% { opacity:1; transform:translate(-50%,-65%) scale(1);   }
  100%{ opacity:0; transform:translate(-50%,-85%) scale(0.8); }
}

/* Particles */
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 7;
}

/* MESSAGE SECTION */
#message-section {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 30%, #1a0510, #05000a 60%, #000005);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 80px 24px;
}

#message-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(120,40,80,0.13) 0%, transparent 50%),
    radial-gradient(circle at 80% 50%, rgba(60,20,100,0.10) 0%, transparent 50%);
  pointer-events: none;
}

.star-bg { position: absolute; inset: 0; pointer-events: none; }

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: starTwinkle 3s ease-in-out infinite;
}

@keyframes starTwinkle {
  0%,100%{ opacity:0.1; transform:scale(1);   }
  50%    { opacity:0.6; transform:scale(1.3); }
}

.heart {
  position: absolute;
  font-size: 1.2rem;
  animation: heartFloat 8s ease-in-out infinite;
  opacity: 0.3;
  pointer-events: none;
}

@keyframes heartFloat {
  0%,100%{ transform:translateY(0) rotate(-10deg); opacity:0.2; }
  50%    { transform:translateY(-30px) rotate(10deg); opacity:0.5; }
}

.msg-content {
  position: relative;
  z-index: 2;
  max-width: 680px;
  text-align: center;
}

.msg-ornament {
  color: var(--gold);
  font-size: 1.8rem;
  letter-spacing: 0.5em;
  margin-bottom: 2rem;
  opacity: 0.6;
}

.msg-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(3rem, 8vw, 5.5rem);
  color: var(--gold-light);
  text-shadow: 0 0 40px rgba(212,168,67,0.5);
  margin-bottom: 2rem;
  line-height: 1.2;
}

.msg-divider {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 2.5rem;
}

.msg-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.2rem, 2.8vw, 1.75rem);
  font-style: italic;
  line-height: 2;
  color: #f0dfc8;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  letter-spacing: 0.03em;
}

.msg-text em {
  color: var(--gold-light);
  font-style: normal;
}

.stage-footer {
  text-align: center;
  padding: 36px;
  color: rgba(212,168,67,0.35);
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  font-family: 'Playfair Display', serif;
  background: #000005;
}

.confetti-piece {
  position: fixed;
  width: 8px;
  height: 8px;
  z-index: 9997;
  pointer-events: none;
  border-radius: 2px;
}
</style>
</head>

<!-- CURTAIN OVERLAY -->
<div id="curtain-overlay">
  <div class="curtain-valance" id="valance"></div>
  <div class="curtain-half left">
    <div class="curtain-fabric"></div>
  </div>
  <div class="curtain-half right">
    <div class="curtain-fabric"></div>
  </div>
  <div id="click-prompt">
    <h1>HER</h1>
    <p>Klik untuk membuka tirai</p>
  </div>
</div>

<!-- CHEER BURST -->
<div class="cheer-burst" id="cheerBurst">🎉 Bravo! 🎉</div>

<!-- STAGE -->
<section id="stage-section">

  <div class="spotlight sp2 spotlight"></div>
  <div class="spotlight sp3 spotlight"></div>
  <div class="stage-side left"></div>

  <div class="performer-container">
    <div class="performer-wrap" id="performerWrap">
      <div class="performer-glow"></div>
      <img class="performer-img" id="performerImg" src="" alt="Her">
      <div class="mic-stand"><div class="mic-head"></div></div>
    </div>
  </div>

  <div class="lyrics-ticker" id="lyricsTicker">
    <div class="lyric-line" id="lyricLine">♪ Take me into your loving arms ♪</div>
  </div>

  <div class="stage-floor"></div>
  <div class="audience-section" id="audienceSection"></div>

  <div class="scroll-hint" id="scrollHint">
    <span>Scroll ke bawah</span>
    <span>↓</span>
  </div>
</section>

<!-- MESSAGE -->
<section id="message-section">

  <div class="heart" style="left:50%;top:10%;animation-delay:3s;">🌸</div>
  <div class="msg-content">
    <div class="msg-ornament">— ✦ —</div>
    <div class="msg-title">For Her</div>
    <div class="msg-divider"></div>
    <p class="msg-text">
      Dia adalah orang paling manis di hidupku,<br>
      tolong selalu temani aku ya?<br><br>
      <em>Kita pasti bisa hadapi semua bersama.</em>
    </p>
    <div class="msg-divider" style="margin-top:2.5rem;"></div>
    <div class="msg-ornament" style="margin-top:1.5rem;margin-bottom:0;">— ✦ —</div>
  </div>
</section>

<div class="stage-footer">HER &nbsp;·&nbsp; With all my love</div>

// Fringe
var valance = document.getElementById('valance');
for (var i = 0; i < 50; i++) {
  var f = document.createElement('div');
  f.className = 'fringe';
  f.style.animationDelay = (Math.random() * 2) + 's';
  valance.appendChild(f);
}

// Stars
var starBg = document.getElementById('starBg');
for (var i = 0; i < 80; i++) {
  var s = document.createElement('div');
  s.className = 'star';
  var sz = Math.random() * 2 + 1;
  s.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*4)+'s;animation-duration:'+(2+Math.random()*3)+'s;';
  starBg.appendChild(s);
}

// Audience
var cheers = ['cheer-a','cheer-b','cheer-c','cheer-d'];
var skins  = ['#c8a080','#b08868','#d4b090','#a07858','#e0c0a0','#906840','#c09070'];
var bodies = ['#1a1a3a','#2a1a2a','#0a2a1a','#2a2a0a','#1a0a2a','#3a1a0a','#0a1a3a'];

function buildAudience() {
  var section = document.getElementById('audienceSection');
  [40, 52, 65].forEach(function(count, ri) {
    var row = document.createElement('div');
    row.className = 'audience-row row' + (ri+1);
    for (var i = 0; i < count; i++) {
      var person = document.createElement('div');
      var sk = skins[Math.floor(Math.random()*skins.length)];
      var bd = bodies[Math.floor(Math.random()*bodies.length)];
      person.className = 'audience-person ' + cheers[Math.floor(Math.random()*cheers.length)];
      person.style.animationDelay = (Math.random()*2) + 's';
      person.style.animationDuration = (0.7 + Math.random()*1.3) + 's';
      var hasArms = Math.random() > 0.35;
      var html = '';
      if (hasArms) {
        html += '<div class="arms"><div class="arm-l" style="background:'+sk+'"></div><div class="arm-r" style="background:'+sk+'"></div></div>';
      }
      html += '<div class="person-head" style="background:radial-gradient(circle,'+sk+','+sk+'99)"></div>';
      html += '<div class="person-body" style="background:linear-gradient(180deg,'+bd+','+bd+'99)"></div>';
      person.innerHTML = html;
      row.appendChild(person);
    }
    section.appendChild(row);
  });
}
buildAudience();

// Lyrics
var lyrics = [
  "♪ When your legs don't work like they used to before ♪",
  "♪ And I can't sweep you off of your feet ♪",
  "♪ Will your mouth still remember the taste of my love? ♪",
  "♪ Will your eyes still smile from your cheeks? ♪",
  "♪ Darling I will be loving you 'til we're 70 ♪",
  "♪ Baby my heart could still fall as hard at 23 ♪",
  "♪ People fall in love in mysterious ways ♪",
  "♪ Maybe just the touch of a hand ♪",
  "♪ I fall in love with you every single day ♪",
  "♪ Take me into your loving arms ♪",
  "♪ Kiss me under the light of a thousand stars ♪",
  "♪ Place your head on my beating heart ♪",
  "♪ I'm thinking out loud ♪",
  "♪ Maybe we found love right where we are ♪",
  "♪ Your soul could never grow old, it's evergreen ♪",
  "♪ Baby your smile's forever in my mind and memory ♪",
  "♪ Take me into your loving arms ♪",
  "♪ Kiss me under the light of a thousand stars ♪",
];

var lyricIdx = 0;

function changeLyric() {
  var el = document.getElementById('lyricLine');
  el.style.opacity = '0';
  setTimeout(function() {
    lyricIdx = (lyricIdx + 1) % lyrics.length;
    el.textContent = lyrics[lyricIdx];
    el.style.opacity = '1';
    el.style.transition = 'opacity 0.6s ease';
  }, 500);
}

// Confetti
function launchConfetti() {
  var colors = ['#d4a843','#f0c97a','#c87090','#9b5b8a','#ffffff','#ff9999','#ffcc44'];
  for (var i = 0; i < 90; i++) {
    (function(delay) {
      setTimeout(function() {
        var c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (Math.random()*100) + 'vw';
        c.style.top = '-10px';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
        document.body.appendChild(c);
        var kf = [
          {top: '-10px', opacity: 1, transform: 'rotate(0deg) translateX(0)'},
          {top: '110vh',  opacity: 0, transform: 'rotate('+(Math.random()*720)+'deg) translateX('+(Math.random()-0.5)*180+'px)'}
        ];
        var anim = c.animate(kf, {duration: 2000+Math.random()*2000, easing: 'ease-in', fill: 'forwards'});
        anim.onfinish = function(){ c.remove(); };
      }, delay);
    })(i * 28);
  }
}

// Particles
function spawnParticle() {
  var stage = document.getElementById('stage-section');
  var p = document.createElement('div');
  p.className = 'particle';
  var pColors = ['rgba(255,220,100,0.8)','rgba(255,150,200,0.6)','rgba(200,150,255,0.5)'];
  var sz = 3 + Math.random() * 4;
  p.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(30+Math.random()*40)+'%;bottom:38%;background:'+pColors[Math.floor(Math.random()*pColors.length)]+';box-shadow:0 0 6px rgba(255,200,100,0.8);';
  stage.appendChild(p);
  p.animate([
    {opacity: 0.8, transform: 'translateY(0) scale(1)'},
    {opacity: 0,   transform: 'translateY(-180px) scale(0.3)'}
  ], {duration: 2500 + Math.random()*1000, easing: 'ease-out', fill: 'forwards'}).onfinish = function(){ p.remove(); };
}

// CURTAIN CLICK
var curtainOpened = false;

document.getElementById('curtain-overlay').addEventListener('click', function() {
  if (curtainOpened) return;
  curtainOpened = true;

  var overlay = document.getElementById('curtain-overlay');
  overlay.classList.add('open');

  setTimeout(function() {
    document.querySelectorAll('.spotlight').forEach(function(s){ s.classList.add('active'); });
  }, 500);

  setTimeout(function() {
    document.getElementById('performerWrap').classList.add('visible');
  }, 900);

  setTimeout(function() {
    document.getElementById('lyricsTicker').classList.add('visible');
    setInterval(changeLyric, 3500);
  }, 1400);

  setTimeout(function() {
    var people = document.querySelectorAll('.audience-person');
    people.forEach(function(p, i) {
      setTimeout(function(){ p.classList.add('visible'); }, i * 12);
    });
  }, 1100);

  setTimeout(function() {
    var burst = document.getElementById('cheerBurst');
    burst.classList.add('show');
    setTimeout(function(){ burst.classList.remove('show'); }, 2500);
  }, 1700);

  setTimeout(launchConfetti, 1700);

  setTimeout(function() {
    setInterval(spawnParticle, 350);
  }, 1500);

  setTimeout(function() {
    document.getElementById('scrollHint').classList.add('visible');
  }, 3200);

  // Remove pointer events after open animation
  setTimeout(function() {
    overlay.style.pointerEvents = 'none';
  }, 1900);
});
</script>
